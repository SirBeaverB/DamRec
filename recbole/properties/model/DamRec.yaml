# DamRec: 与 instruct.md 一致的预条件门控 Delta（秩一 V_r/V_k，ρ-EMA）

embedding_size: 64
dropout_prob: 0.3
loss_type: 'CE'
train_neg_sample_args: ~

n_layers: 1
num_heads: 4
conv_kernel_size: 3
ffn_ratio: 4
streaming_mode: False

# instruct.md 二阶矩 EMA 与数值稳定
damrec_rho: 0.99
damrec_eps: 1e-4
damrec_chunk_size: 16
# Chunk 时：块内 FLA 加速 + no_grad 下 instruct 影子循环，仅用于 V 的 (38)(39)（需 CUDA+flash-linear-attention）
damrec_chunk_use_fla: True
use_chunk_adam: False
