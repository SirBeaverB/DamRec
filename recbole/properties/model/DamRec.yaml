# DamRec: Delta-Adam Memory for Streaming Recommendation
# SGD → Adam 等价更新

embedding_size: 64
dropout_prob: 0.3
loss_type: 'CE'
train_neg_sample_args: ~

n_layers: 1
num_heads: 4
conv_kernel_size: 3
ffn_ratio: 4
streaming_mode: False

# Adam 等价参数 (η 过小会退化成 GDN，0.05 为折中)
adam_beta1: 0.9
adam_beta2: 0.99      # 流式步数少，加快方差遗忘
adam_eps: 1e-4        # 适度稳定，不压制自适应
adam_eta: 0.05        # 0.02 过小易退化成 GDN，0.1 可能过猛
use_chunk_adam: False   # True=Chunk 级 FLA 加速
