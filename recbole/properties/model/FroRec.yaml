# FroRec: Frobenius Adam for Delta Rule in Streaming Recommendation
# F-Adam: V 标量 [B,H,1,1]，不破坏 M 的秩一外积方向，几何安全 + 自适应抗噪

embedding_size: 64
dropout_prob: 0.3
loss_type: 'CE'
train_neg_sample_args: ~

n_layers: 1
num_heads: 4
conv_kernel_size: 3
ffn_ratio: 4
streaming_mode: False

adam_beta1: 0.9
adam_beta2: 0.99
adam_eps: 1e-4
adam_eta: 0.05        # 0.02 过小易退化成 GDN
