# NestRec 非流式配置 - Nesterov 动量版 delta rule，标准训练
# Use: python run_recbole.py --model=NestRec --config_files=recbole/properties/quick_start_config/sequential_NestRec.yaml

dataset: ml-100k
MAX_ITEM_LIST_LENGTH: 50
embedding_size: 64
streaming_mode: False
dropout_prob: 0.2
momentum: 0.8
momentum_eta: 0.15
use_chunk_nesterov: True   # FLA 加速 + Chunk 级 Nesterov
train_neg_sample_args: ~

eval_args:
  split: {'LS': 'valid_and_test'}
  order: TO
  mode: full

repeatable: True
train_batch_size: 4096
eval_batch_size: 2048
epochs: 100
stopping_step: 10
learning_rate: 0.001
