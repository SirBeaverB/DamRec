# DamRec 非流式配置 - Adam 等价 delta rule
# Use: python run_recbole.py --model=DamRec --config_files=recbole/properties/quick_start_config/sequential_DamRec.yaml
# 注意: Adam sqrt/除法易产生 NaN，必须关闭 AMP；use_compile 也可能引发问题

dataset: ml-100k
MAX_ITEM_LIST_LENGTH: 50
embedding_size: 64
streaming_mode: False
dropout_prob: 0.2
adam_beta1: 0.9
adam_beta2: 0.99
adam_eps: 1e-4
adam_eta: 0.05
use_chunk_adam: True   # FLA 加速 + Chunk 级 Adam
enable_amp: False      # Adam 除法易 NaN，必须关闭
use_compile: False     # 避免 compile 与 ChunkAdam 的兼容问题
train_neg_sample_args: ~

eval_args:
  split: {'LS': 'valid_and_test'}
  order: TO
  mode: full

repeatable: True
train_batch_size: 4096
eval_batch_size: 2048
epochs: 100
stopping_step: 10
learning_rate: 0.001
