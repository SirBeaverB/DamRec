# DamRec — 与 instruct.md 一致（α/β 门控 + 秩一 V_r,V_k + P 预条件）
# Use: python run_recbole.py --model=DamRec --config_files=recbole/properties/quick_start_config/sequential_DamRec.yaml
# 关闭 AMP 可避免除法数值问题

dataset: ml-100k
MAX_ITEM_LIST_LENGTH: 50
embedding_size: 64
streaming_mode: False
dropout_prob: 0.2
damrec_rho: 0.99
damrec_eps: 1e-4
damrec_chunk_size: 16
damrec_chunk_use_fla: True
use_chunk_adam: True
enable_amp: False
use_compile: False
train_neg_sample_args: ~

eval_args:
  split: {'LS': 'valid_and_test'}
  order: TO
  mode: full

repeatable: True
train_batch_size: 4096
eval_batch_size: 2048
epochs: 100
stopping_step: 10
learning_rate: 0.001
