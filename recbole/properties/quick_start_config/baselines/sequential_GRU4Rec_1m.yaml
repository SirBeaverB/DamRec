# GRU4Rec - 经典 RNN 序列推荐 (Hidasi et al., 2015)
# 与 run_non_streaming_experiments_1m 相同配置

dataset: ml-1m
MAX_ITEM_LIST_LENGTH: 128
embedding_size: 64
hidden_size: 128
num_layers: 1
dropout_prob: 0.3
streaming_mode: False
train_neg_sample_args: ~

eval_args:
  split: {'LS': 'valid_and_test'}
  order: TO
  mode: full

repeatable: True
train_batch_size: 4096
eval_batch_size: 2048
epochs: 150
stopping_step: 10
learning_rate: 0.001
loss_type: CE
