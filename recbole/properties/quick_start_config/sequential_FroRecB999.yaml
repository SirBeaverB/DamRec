# FroRecB999: FroRec 超参探针 - adam_beta2 从 0.99 提到 0.999
# 假设：默认 beta2=0.99 对应有效记忆 ~100 步，流式下 per-user chunk 数可能 >100，V 估计噪声主导；
# 提到 0.999 后 V 记忆拉长到 ~1000 步，在 streaming 长 horizon 下 V 更稳。

dataset: ml-100k
MAX_ITEM_LIST_LENGTH: 50
embedding_size: 64
streaming_mode: False
dropout_prob: 0.2
adam_beta1: 0.9
adam_beta2: 0.999     # 唯一变动：0.99 → 0.999
adam_eps: 1e-4
adam_eta: 0.05
train_neg_sample_args: ~

eval_args:
  split: {'LS': 'valid_and_test'}
  order: TO
  mode: full

repeatable: True
train_batch_size: 4096
eval_batch_size: 2048
epochs: 100
stopping_step: 10
learning_rate: 0.001
