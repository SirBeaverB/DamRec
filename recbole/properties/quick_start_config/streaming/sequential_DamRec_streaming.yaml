# DamRec streaming — instruct.md 一致实现
# use_chunk_adam: True 为分块 §7（无需 FLA）

model: DamRec
dataset: ml-100k
MAX_ITEM_LIST_LENGTH: 50
embedding_size: 64
streaming_mode: True
dropout_prob: 0.2
damrec_rho: 0.99
damrec_eps: 1e-4
damrec_chunk_size: 16
damrec_chunk_use_fla: True
use_chunk_adam: True
train_neg_sample_args: ~

shuffle: False

eval_args:
  split: {'RS': [0.8, 0.1, 0.1]}
  group_by: none
  order: TO
  mode: full

repeatable: True
train_batch_size: 4096
eval_batch_size: 2048
enable_amp: False
enable_scaler: False
worker: 4
use_compile: True
epochs: 100
stopping_step: 10
learning_rate: 0.001
clip_grad_norm:
  max_norm: 1.0
