# FroRec streaming - F-Adam (Frobenius 范数标量 V，几何安全)
# Use: python run_recbole.py --model=FroRec --config_files=recbole/properties/quick_start_config/streaming/sequential_FroRec_streaming.yaml
# 需要 FLA + CUDA

model: FroRec
dataset: ml-100k
MAX_ITEM_LIST_LENGTH: 50
embedding_size: 64
streaming_mode: True
dropout_prob: 0.2
adam_beta1: 0.9
adam_beta2: 0.99
adam_eps: 1e-4
adam_eta: 0.05   # 0.02 过小易退化成 GDN
train_neg_sample_args: ~

shuffle: False

eval_args:
  split: {'RS': [0.8, 0.1, 0.1]}
  group_by: none
  order: TO
  mode: full

repeatable: True
train_batch_size: 4096
eval_batch_size: 2048
enable_amp: False
enable_scaler: False
worker: 4
use_compile: True
epochs: 100
stopping_step: 10
learning_rate: 0.001
clip_grad_norm:
  max_norm: 1.0
