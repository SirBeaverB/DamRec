# NestRec streaming config - Nesterov 动量版 delta rule (Lookahead Momentum)
# use_chunk_nesterov: True 时用 FLA + Chunk 级宏观 Nesterov；False 时用 Token 级 Python 循环
# Use with: python run_recbole.py --model=NestRec --config_files=recbole/properties/quick_start_config/streaming/sequential_NestRec_streaming.yaml

dataset: ml-100k
MAX_ITEM_LIST_LENGTH: 50
embedding_size: 64
streaming_mode: True
dropout_prob: 0.2
momentum: 0.8
momentum_eta: 0.15
use_chunk_nesterov: True   # FLA 加速 + Chunk 级 Nesterov 动量
train_neg_sample_args: ~

shuffle: False

eval_args:
  split: {'RS': [0.8, 0.1, 0.1]}
  group_by: none
  order: TO
  mode: full

repeatable: True
train_batch_size: 4096
eval_batch_size: 2048
enable_amp: True
enable_scaler: True
worker: 4
use_compile: True
epochs: 100
stopping_step: 10
learning_rate: 0.001
clip_grad_norm:
  max_norm: 1.0
